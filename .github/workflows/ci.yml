name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Minimum permissions for security (principle of least privilege)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --verbose
      - run: cargo test --verbose
      # Exercise every feature combo so guard/secure-open compile-only paths get linted.
      - run: cargo build --all-features --verbose
      - run: cargo test --all-features --verbose

  # Verify we compile on the Minimum Supported Rust Version
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # master
        with:
          toolchain: "1.85"
      - run: cargo build --all-features --verbose
      - run: cargo test --all-features --verbose

  # Cross-compile and run the suite under QEMU user-mode emulation. The guard
  # fallback and secure-open carry per-architecture O_* tables (O_NOFOLLOW,
  # O_NONBLOCK, O_NOCTTY) and ELOOP values; QEMU translates guest flag values,
  # so a wrong constant shows up as a failing test here.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # cross's QEMU runner does not implement openat2. Compile every
          # feature on AArch64, but run its secure-open suite without guard;
          # the aarch64-native job runs the guard suite.
          - target: aarch64-unknown-linux-gnu
            test_args: --features secure-open
          # ARMv7 uses the guard fallback, so exercise every feature at runtime.
          - target: armv7-unknown-linux-gnueabihf
            test_args: --all-features
          # 32-bit x86: asm-generic flags on a 32-bit target.
          - target: i686-unknown-linux-gnu
            test_args: --all-features
          # PowerPC shares ARM's O_NOFOLLOW (0x8000); 32-bit big-endian.
          - target: powerpc-unknown-linux-gnu
            test_args: --all-features
          - target: powerpc64le-unknown-linux-gnu
            test_args: --all-features
          - target: riscv64gc-unknown-linux-gnu
            test_args: --all-features
          # 64-bit big-endian: also checks attestation encoding is LE-fixed.
          - target: s390x-unknown-linux-gnu
            test_args: --all-features
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install cross
        run: cargo install --locked cross --version 0.2.5
      - name: Build
        run: cross build --all-features --target ${{ matrix.target }} --verbose
      - name: Test
        run: cross test ${{ matrix.test_args }} --target ${{ matrix.target }} --verbose

  # Compile and lint every feature for targets CI cannot run. `check` needs only
  # the target's std (no linker), which covers the per-OS cfg branches.
  check-targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            features: --all-features
          - target: x86_64-unknown-freebsd
            features: --all-features
          - target: x86_64-unknown-netbsd
            features: --all-features
          - target: loongarch64-unknown-linux-gnu
            features: --all-features
          # SPARC has its own O_NONBLOCK/O_NOCTTY values and ELOOP = 62. Runtime
          # tests are not possible with cross 0.2.5: its sparc64 image's glibc
          # predates getrandom, which current std links against.
          - target: sparc64-unknown-linux-gnu
            features: --all-features
          # guard and secure-open refuse to build on illumos (unknown O_* ABI);
          # check the path-only API, including its illumos ELOOP branch.
          - target: x86_64-unknown-illumos
            features: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - run: cargo clippy ${{ matrix.features }} --all-targets --target ${{ matrix.target }} -- -D warnings

  # Run the full suite on a real FreeBSD kernel: the BSD fallback (O_NOFOLLOW,
  # O_NONBLOCK = 0x4, ELOOP = 62, extern fcntl) executes here.
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test on FreeBSD 14
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: "14"
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            rustc --version
            cargo test --all-features --verbose

  # Native AArch64 runner: the cross/QEMU job above cannot execute openat2,
  # so this is where the guard feature's aarch64 flags and syscalls run for real.
  aarch64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - run: cargo test --all-features --verbose

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy
      - run: cargo clippy --all-features --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Every `rust` block in README.md and docs/guides/ is either an ANCHOR region
  # of a compiled program in doc-examples/examples or marked `rust,ignore`.
  # Build them on Linux (openat2 path, create_dir/rename) and macOS (fallback).
  doc-examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --manifest-path doc-examples/Cargo.toml --check
      - name: Docs match compiled examples
        run: python3 scripts/check_doc_examples.py
      - name: Build examples
        run: cargo build --manifest-path doc-examples/Cargo.toml --examples
        env:
          RUSTFLAGS: -D warnings

  # Supply-chain check: advisories, licenses, dep bans, sources.
  # Config lives in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Run cargo-deny
        run: cargo deny --all-features check

  # Semver discipline: catch breaking changes between commits and the
  # last-published version on crates.io. Runs on PRs only; main is allowed to
  # bump major/minor explicitly.
  semver-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install cargo-semver-checks
        run: cargo install --locked cargo-semver-checks --version 0.51.0
      - name: Run cargo-semver-checks
        run: cargo semver-checks check-release --all-features
