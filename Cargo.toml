[package]
name = "path_jail"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A secure filesystem sandbox. Restricts paths to a root directory, preventing traversal attacks."
repository = "https://github.com/tenuo-ai/path_jail"
homepage = "https://tenuo.ai"
keywords = ["security", "filesystem", "sandbox", "path", "traversal"]
categories = ["filesystem", "security"]
exclude = [
    "docs/",          # design specs — not needed by crate consumers
    ".claude/",       # IDE settings
    ".github/",       # CI config
    "tests/",         # integration tests (already excluded by cargo by default, explicit for clarity)
]

[features]
default = []
# TOCTOU-safe file operations using O_NOFOLLOW (Unix only, zero deps)
secure-open = []
# guard API: TOCTOU-safe openat2(RESOLVE_BENEATH) on Linux 5.6+,
# O_NOFOLLOW fallback on macOS/BSD. Zero new dependencies.
guard = []

[dependencies]
# No runtime dependencies!

[dev-dependencies]
tempfile = "3"

[package.metadata]
authors = ["Niki A. <dev@tenuo.dev>"]